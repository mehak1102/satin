      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,560&family=Outfit:wght@360;480;580&family=Jost:wght@400..600&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Satin — Soft absorbent for bold moves</title>
    <style>
      body.satin-booting { overflow: hidden; }
      #satin-boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 42%, #f8e4ea 0%, transparent 58%),
          radial-gradient(ellipse 50% 40% at 80% 85%, #eadff4 0%, transparent 50%),
          #fbf6f1;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #satin-boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .satin-boot-core {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .satin-boot-bouquet {
        width: clamp(280px, min(88vw, 58vh), 1100px);
        height: auto;
        object-fit: contain;
        margin-bottom: -0.5rem;
        animation: satin-boot-rise 0.9s ease both;
      }
      .satin-boot-logo {
        width: clamp(320px, min(90vw, 62vh), 1200px);
        height: auto;
        animation: satin-boot-rise 0.9s ease 0.08s both;
      }
      .satin-boot-heading {
        margin: clamp(0.8rem, 2vh, 1.6rem) 0 0;
        font-family: Outfit, "Segoe UI", sans-serif;
        font-size: clamp(1.05rem, min(2.6vw, 3.4vh), 2.75rem);
        font-weight: 580;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #14384c;
        animation: satin-boot-rise 0.9s ease 0.18s both;
      }
      .satin-boot-dots {
        display: flex;
        gap: 0.4rem;
        margin-top: 1.35rem;
        animation: satin-boot-rise 0.9s ease 0.3s both;
      }
      .satin-boot-dots i {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #c45d73;
        opacity: 0.35;
        animation: satin-boot-dot 1.1s ease-in-out infinite;
      }
      .satin-boot-dots i:nth-child(2) { animation-delay: 0.16s; background: #6d294f; }
      .satin-boot-dots i:nth-child(3) { animation-delay: 0.32s; }
      @keyframes satin-boot-rise {
        from { opacity: 0; transform: translateY(14px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      @keyframes satin-boot-dot {
        0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .satin-boot-bouquet,
        .satin-boot-logo,
        .satin-boot-heading,
        .satin-boot-dots,
        .satin-boot-dots i { animation: none; }
      }
    </style>
  </head>
  <body class="satin-booting">
    <div id="satin-boot" role="status" aria-live="polite" aria-label="Satin is loading">
      <div class="satin-boot-core">
        <img class="satin-boot-bouquet" src="/home/satin-boot-bouquet.png" width="821" height="756" alt="" />
        <img class="satin-boot-logo" src="/satin-wordmark.png" width="1024" height="339" alt="Satin" />
        <p class="satin-boot-heading">Women's hygiene products</p>
        <span class="satin-boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
